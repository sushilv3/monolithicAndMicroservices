spring:
  application:
    name: ecom-order-service
server:
  port: 8080

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/


logging:
  level:
    com.sushil.ecom_order_service.client: DEBUG
resilience4j:
  ratelimiter:
    instances:
      inventoryService:
        limit-for-period: 2
        limit-refresh-period: 10s
        timeout-duration: 0s


