spring:
  application:
    name: ecom-api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ecom-order-service
              uri: lb://ECOM-ORDER-SERVICE
              predicates:
                - Path=/order/**
            - id: ecom-inventory-service
              uri: lb://ECOM-INVENTORY-SERVICE
              predicates:
                - Path=/inventory/**
server:
  port: 9090

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
  service-url:
    defaultZone: http://localhost:8761/eureka/
